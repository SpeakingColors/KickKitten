<title>Kick Kitten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one fixed-size plugin window (1120x946) scaled as a whole, wood cheeks left and right.
   Looks: C PurrOne (default), A Neon Navy, B Purple Soda Pop. All colours come from these tokens. */
:root{
  --ground:#121214; --panel:#1b1b1e; --panel2:#242428; --display:#08080a; --line:#34343a;
  --text:#f2f2f4; --dim:#a0a0a8; --title:#ffffff; --cap:#7fc8f0; --grid:#23262b;
  --knob:#e9e9ee; --knobtrack:#3a3a42; --read:#02EBBA; --warn:#FFA600;
  --curve:#02EBBA; --curve2:#FFA600; --fill:#02EBBA;
  --c-click:#FF1383; --c-body:#FFA600; --c-sub:#02EBBA;
  --m-ok:#6CC9F5; --m-warn:#A43DFF; --m-clip:#FF1383;
  --btn:#2b2b31; --btnh:#38383f; --sel:#4a3a12; --selb:#FFA600;
  color-scheme:dark;
}
:root[data-look="A"]{
  --ground:#161638; --panel:#1c1c4a; --panel2:#2C2C62; --display:#05060d; --line:#33403f;
  --text:#e8e6e1; --dim:#9a9690; --title:#c7c9ff; --cap:#6CC9F5; --grid:#1b1d3a;
  --knob:#FFA600; --knobtrack:#3a3a78; --read:#02EBBA; --warn:#FFA600;
  --curve:#6CC9F5; --curve2:#FFA600; --fill:#6CC9F5;
  --btn:#2C2C62; --btnh:#3a3a80; --sel:#3a2c10; --selb:#FFA600;
}
:root[data-look="B"]{
  --ground:#0b0b0d; --panel:#15161a; --panel2:#1c1d22; --display:#06080a; --line:#2b2d34;
  --text:#f4f5f7; --dim:#a9adb8; --title:#E1CBF4; --cap:#02EBBA; --grid:#1b2523;
  --knob:#02EBBA; --knobtrack:#2b2d34; --read:#FFD100; --warn:#FF1383;
  --curve:#02EBBA; --curve2:#FF1383; --fill:#A43DFF;
  --btn:#1c1d22; --btnh:#2b2d34; --sel:#241238; --selb:#CD92FE;
}
*{box-sizing:border-box}
html,body{background:var(--ground);}
body{margin:0;color:var(--text);font:13px/1.35 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden}
#stage{display:flex;justify-content:center;width:100%}
#wrap{position:relative;flex:none}
#win{position:absolute;left:0;top:0;width:1120px;height:946px;transform-origin:0 0;background:var(--ground);overflow:hidden;
  box-shadow:0 8px 30px #0008;user-select:none;-webkit-user-select:none}
.cheek{position:absolute;top:0;width:52px;height:946px}
.cheek.l{left:0}.cheek.r{right:0}
#inner{position:absolute;left:52px;right:52px;top:0;bottom:0;display:flex;flex-direction:column;padding:8px 8px 4px;gap:8px}
button,select,input{font:inherit;color:var(--text)}
button{white-space:nowrap;background:var(--btn);border:1px solid var(--line);border-radius:4px;padding:2px 9px;cursor:pointer;letter-spacing:.03em;height:26px}
button:hover{background:var(--btnh)}
button:focus-visible,select:focus-visible,input:focus-visible,.knob:focus-visible,canvas:focus-visible{outline:2px solid var(--selb);outline-offset:1px}
button.on{background:var(--sel);border-color:var(--selb)}
#hdr button{font-size:12px;padding:2px 7px}
#hdr{display:flex;align-items:center;gap:8px;height:34px;flex:none}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo{width:30px;height:30px;color:var(--text);--eyecut:var(--ground)}
.brand b{font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--title)}
.brand span{font-size:11px;color:var(--cap);letter-spacing:.14em;text-transform:uppercase}
.presetbar{display:flex;align-items:center;gap:4px;margin-left:auto}
#pName{min-width:118px;text-align:left;font-weight:600;color:var(--read);font-family:"JetBrains Mono",monospace;font-size:12px}
.hbtn{display:flex;gap:4px;margin-left:4px}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 330px 56px;grid-template-rows:1fr 1fr;gap:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px 6px;display:flex;flex-direction:column;min-width:0;min-height:0}
.panel h2{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--title)}
.panel h2 small{font-weight:500;color:var(--cap);letter-spacing:.06em;text-transform:none;margin-left:8px}
.panel canvas{display:block;width:100%;flex:1;min-height:0;background:var(--display);border-radius:3px;border:1px solid var(--line)}
.ctl{display:flex;align-items:flex-end;gap:4px;height:104px;flex:none;padding-top:18px}
.grp{display:flex;gap:2px;align-items:flex-end;padding:0 6px;border-left:1px solid var(--line);position:relative}
.grp:first-child{border-left:0;padding-left:0}
.grp>i{position:absolute;top:-15px;left:6px;white-space:nowrap;font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cap)}
.knob{width:72px;display:flex;flex-direction:column;align-items:center;cursor:ns-resize;outline:none;touch-action:none}
.knob .kl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);height:13px}
.knob svg{width:46px;height:46px;display:block}
.knob .ktrack{fill:none;stroke:var(--knobtrack);stroke-width:3.5;stroke-linecap:round}
.knob .kval{fill:none;stroke:var(--knob);stroke-width:3.5;stroke-linecap:round}
.knob .kptr{stroke:var(--text);stroke-width:2;stroke-linecap:round}
.knob .kv{font:600 11px "JetBrains Mono",monospace;color:var(--read);height:15px;white-space:nowrap}
.cell{width:84px;display:flex;flex-direction:column;align-items:center;gap:3px}
.cell .kl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cell select{background:var(--btn);border:1px solid var(--line);border-radius:4px;height:26px;width:76px}
.chip{font:600 11px "JetBrains Mono",monospace;color:var(--read);background:var(--display);border:1px solid var(--line);border-radius:3px;padding:1px 6px;white-space:nowrap}
.chip{margin:0}
button.chip{height:auto;background:var(--display);cursor:pointer}
button.chip:hover{border-color:var(--selb)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 0}
.lbl{color:var(--cap);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#meterCol{grid-column:3;grid-row:1/3;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 4px;display:flex;flex-direction:column;gap:4px;min-height:0}
#meterCol h2{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--title);text-align:center}
#cvMeter{flex:1;min-height:0;width:100%;display:block}
#pkRead{font:600 11px "JetBrains Mono",monospace;text-align:center;cursor:pointer;background:var(--display);border:1px solid var(--line);border-radius:3px;padding:1px 0}
#tops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:138px;flex:none}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.slot.drag{border-color:var(--selb);background:var(--sel)}
.sh{display:flex;align-items:center;gap:4px}
.sh b{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--title);white-space:nowrap}
.sh select{flex:1;min-width:0;height:22px;background:var(--btn);border:1px solid var(--line);border-radius:4px;font-size:12px}
.sh button{height:22px;padding:0 6px;font-size:12px}
.slot canvas{display:block;width:100%;height:32px;flex:none;background:var(--display);border:1px solid var(--line);border-radius:3px}
.sk{display:flex;justify-content:space-between}
.knob.sm{width:44px}.knob.sm .kl{font-size:9px;height:11px;letter-spacing:.04em}.knob.sm svg{width:34px;height:34px}.knob.sm .kv{font-size:9px;height:12px}
#keys{display:flex;gap:8px;height:84px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
#kctl{width:118px;flex:none;display:flex;flex-direction:column;gap:3px;justify-content:center}
#kctl .row{display:flex;gap:4px;align-items:center}
#kctl button{padding:0 6px;font-size:12px;height:22px}
#kctl .row button{flex:1}
#played{font-size:11px;padding:1px 3px;text-align:center}
#piano{position:relative;flex:1;height:100%;touch-action:none}
.wk,.bk{position:absolute;top:0;border-radius:0 0 4px 4px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font:600 10px "JetBrains Mono",monospace;padding-bottom:3px}
.wk{background:#e9e9ee;color:#55555e;border:1px solid #14141a;height:100%}
.bk{background:#17171b;color:#9aa;border:1px solid #000;height:60%;z-index:2}
.wk.on{background:var(--read)}.bk.on{background:var(--selb);color:#000}
.wk.c{border-bottom:3px solid var(--cap)}
#rig{display:flex;align-items:center;gap:10px;height:34px;flex:none;border:1px dashed var(--line);border-radius:6px;padding:0 10px}
#rig .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cap)}
#hitBtn{height:26px;min-width:64px;font-weight:700;background:var(--sel);border-color:var(--selb)}
#bpm{width:58px;background:var(--display);border:1px solid var(--line);border-radius:4px;height:26px;text-align:center;font-family:"JetBrains Mono",monospace}
.zoom{margin-left:auto;display:flex;align-items:center;gap:4px}
.zoom button{padding:0 8px}
#foot{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);letter-spacing:.06em;height:16px;flex:none}
.hnd{position:absolute;z-index:5}
.hnd.n,.hnd.s{left:12px;right:12px;height:10px;cursor:ns-resize}.hnd.n{top:-5px}.hnd.s{bottom:-5px}
.hnd.e,.hnd.w{top:12px;bottom:12px;width:10px;cursor:ew-resize}.hnd.e{right:-5px}.hnd.w{left:-5px}
.hnd.ne,.hnd.nw,.hnd.se,.hnd.sw{width:16px;height:16px}
.hnd.ne{top:-6px;right:-6px;cursor:nesw-resize}.hnd.sw{bottom:-6px;left:-6px;cursor:nesw-resize}
.hnd.nw{top:-6px;left:-6px;cursor:nwse-resize}.hnd.se{bottom:-6px;right:-6px;cursor:nwse-resize}
#dlgBack[hidden]{display:none}
#dlgBack{position:absolute;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center}
#dlg{width:560px;max-height:640px;overflow:auto;background:var(--panel);border:1px solid var(--selb);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#dlg h3{margin:0;font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:var(--title)}
#dlg p,#dlg li{margin:0;font-size:14px;color:var(--text)}
#dlg ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
#dlg .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#dlg input[type=text],#dlg textarea,#dlg select{background:var(--display);border:1px solid var(--line);border-radius:4px;padding:4px 8px;width:100%;font-family:"JetBrains Mono",monospace;font-size:12px;user-select:text;-webkit-user-select:text}
#dlg textarea{height:150px;resize:none}
#dlg .list{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:4px}
#dlg .item{display:flex;justify-content:space-between;padding:4px 8px;cursor:pointer;font-size:14px}
#dlg .item:hover{background:var(--btnh)}#dlg .item.cur{background:var(--sel)}
#dlg .item span{color:var(--cap);font-size:12px}
#dlg .err{color:var(--m-clip)}
#dlg .btns{display:flex;gap:8px;justify-content:flex-end}
#dlg a{color:var(--read)}
#tip{position:fixed;z-index:50;max-width:260px;background:#000d;border:1px solid var(--selb);color:#fff;padding:6px 9px;border-radius:5px;font:13px/1.35 "Barlow Condensed",system-ui,sans-serif;pointer-events:none;opacity:0;transition:opacity .12s}
#tip.show{opacity:1}
@media (prefers-reduced-motion:reduce){#tip{transition:none}}
</style>

<div id="stage"><div id="wrap">
<div id="win" role="application" aria-label="Kick Kitten kick drum synth">
  <canvas class="cheek l" id="cheekL" aria-hidden="true"></canvas>
  <canvas class="cheek r" id="cheekR" aria-hidden="true"></canvas>
  <div id="inner">
    <header id="hdr">
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <path fill="currentColor" d="M9 6 L25 18 Q32 15.5 39 18 L55 6 L58 33 Q58 55 32 60 Q6 55 6 33 Z"/>
          <path fill="var(--eyecut)" d="M12 28 Q22 26 30 36 Q18 37 12 28 Z"/>
          <path fill="var(--eyecut)" d="M52 28 Q42 26 34 36 Q46 37 52 28 Z"/>
          <path fill="var(--eyecut)" d="M29.5 45 H34.5 L32 49 Z"/>
          <path d="M32 49 V52 M26 53 Q32 56 38 53" stroke="var(--eyecut)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </svg>
        <b>Kick Kitten</b><span>Studio 87</span>
      </div>
      <div class="presetbar">
        <button id="pPrev" aria-label="Previous preset" data-tip="Previous preset. Left arrow key does the same.">‹</button>
        <button id="pName" data-tip="Open the preset list. Search by name or tag.">Uplifting 138</button>
        <button id="pNext" aria-label="Next preset" data-tip="Next preset. Right arrow key does the same.">›</button>
        <button id="pSave" data-tip="Save the current sound. Saving a factory sound makes your own copy.">Save</button>
        <button id="pRename" data-tip="Rename your own preset.">Rename</button>
        <button id="pDel" data-tip="Delete your own preset. Factory sounds stay.">Delete</button>
        <button id="pExp" data-tip="Show this sound as text you can copy and share.">Export</button>
        <button id="pImp" data-tip="Paste a shared sound. Unknown or invalid values are ignored.">Import</button>
      </div>
      <div class="hbtn">
        <button id="bGuide" data-tip="Quick guide and keyboard shortcuts.">Guide</button>
        <button id="bSet" data-tip="Bubbles, power saving and colour look.">Settings</button>
        <button id="bAbout" data-tip="About, licence, where presets live, support.">About &amp; Support</button>
      </div>
    </header>

    <div id="grid">
      <section class="panel" id="pPitch" style="grid-column:1;grid-row:1">
        <h2>Pitch envelope <small>drag the dots and the tail line</small></h2>
        <canvas id="cvPitch" tabindex="0" aria-label="Pitch envelope graph"></canvas>
        <div class="ctl" id="ctlPitch"></div>
      </section>
      <section class="panel" id="pSpec" style="grid-column:2;grid-row:1">
        <h2>Spectrum <small>first 370 ms</small></h2>
        <canvas id="cvSpec" aria-label="Spectrum of the kick"></canvas>
        <div class="ctl" id="ctlSpec"></div>
      </section>
      <section class="panel" id="pWave" style="grid-column:1;grid-row:2">
        <h2>Waveform &amp; layers <small id="waveSub"></small></h2>
        <canvas id="cvWave" aria-label="Kick waveform with time ruler"></canvas>
        <div class="ctl" id="ctlWave"></div>
      </section>
      <section class="panel" id="pOut" style="grid-column:2;grid-row:2">
        <h2>Output &amp; timing</h2>
        <canvas id="cvGap" aria-label="Kick tail against one beat at the current tempo"></canvas>
        <div class="chips" id="chips"></div>
        <div class="ctl" id="ctlOut"></div>
      </section>
      <aside id="meterCol">
        <h2>Out</h2>
        <div id="pkRead" data-tip="Peak of the real output in dB. Click to clear the clip latch.">-inf</div>
        <canvas id="cvMeter" aria-label="Output level meter in dB"></canvas>
      </aside>
    </div>

    <div id="tops" aria-label="Layers and tops"></div>
    <div id="keys">
      <div id="kctl">
        <div class="row"><button id="oDn" aria-label="Octave down" data-tip="Move the keyboard one octave down. Key: Z.">Oct −</button><button id="oUp" aria-label="Octave up" data-tip="Move the keyboard one octave up. Key: X.">+</button></div>
        <div class="row"><button id="kmS" data-tip="Same kick: every key plays exactly the kick you set, whatever key you press.">Same</button><button id="kmP" class="on" data-tip="Pitched: each key retunes the whole kick to that note, so it plays up or down the keyboard.">Pitched</button></div>
        <span class="chip" id="played">-</span>
      </div>
      <div id="piano" data-tip="Click the keys, or use your computer keyboard like Ableton Live: A S D F G H J K L ; ' are the white keys, W E T Y U O P the black keys. Z octave down, X octave up."></div>
    </div>
    <div id="rig">
      <span class="tag" data-tip="This strip only helps you test the sound. It is not part of the plugin.">Preview rig</span>
      <button id="hitBtn" data-tip="Play the kick. Space bar does the same.">Hit</button>
      <button id="loopBtn" data-tip="Loop one kick per beat at the tempo on the right.">Loop</button>
      <span class="lbl">BPM</span><input id="bpm" type="number" min="60" max="200" step="1" value="138" data-tip="Tempo used by the loop and the timing readout. 138 is the default.">
      <button id="bassBtn" data-tip="Adds a simple rolling bass on the 16th notes after each kick, one octave above the tail note, so you can hear how kick and bass sit together.">Bass test</button>
      <div class="zoom"><span class="lbl">Zoom</span><button id="zOut" aria-label="Smaller">−</button><span class="chip" id="zPct">100%</span><button id="zIn" aria-label="Bigger">+</button></div>
    </div>
    <div id="foot"><span>Studio 87 · Kick Kitten v0.1 design mockup</span><span id="sizeRO"></span></div>
  </div>
  <div id="dlgBack" hidden><div id="dlg" role="dialog" aria-modal="true"></div></div>
</div>
</div></div>
<div id="tip" role="tooltip"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const W=1120,H=946;
const NOTE=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function hz2note(f){const n=12*Math.log2(f/440)+69,r=Math.round(n);return{name:NOTE[((r%12)+12)%12]+(Math.floor(r/12)-1),cents:(n-r)*100};}
const KEYS=[];for(let m=23;m<=39;m++)KEYS.push([NOTE[m%12]+(Math.floor(m/12)-1),440*Math.pow(2,(m-69)/12)]);

/* ---------- parameters ---------- */
const SPEC=[
 {id:'tailHz',label:'Tail',min:30,max:80,log:1,unit:' Hz',dec:1,def:55,tip:'The pitch the kick settles on. Tune it to the root note of your track so kick and sub bass add up instead of fighting. A1 is 55 Hz, F#1 is 46.25 Hz.'},
 {id:'startHz',label:'Start',min:200,max:2000,log:1,unit:' Hz',dec:0,def:900,tip:'Pitch at the very first moment. A high start (about 800 to 1000 Hz) gives the snap.'},
 {id:'sweep',label:'Sweep',min:8,max:80,log:1,unit:' ms',dec:1,def:30,tip:'How fast the pitch falls from Start to Tail. About 25 to 35 ms is tight. Around 80 ms starts to sound like a laser.'},
 {id:'curve',label:'Curve',min:0.5,max:2,log:1,unit:'',dec:2,def:1,tip:'Shape of the fall. 1.00 is exponential. Lower drops faster at the start, higher drops slower at the start.'},
 {id:'clickLvl',label:'Level',min:0,max:100,unit:' %',dec:0,def:50,tip:'Loudness of the click, the short high knock that lets you hear the kick inside a wall of supersaws.'},
 {id:'clickFreq',label:'Freq',min:1500,max:8000,log:1,unit:' Hz',dec:0,def:3500,tip:'Centre frequency of the click. Roughly 2 to 5 kHz cuts through leads.'},
 {id:'clickLen',label:'Length',min:1,max:15,log:1,unit:' ms',dec:1,def:4,tip:'How long the click lasts. Longer clicks sound harder and more clicky.'},
 {id:'body',label:'Body',min:0,max:100,unit:' %',dec:0,def:80,tip:'Extra punch in the first tens of milliseconds, while the pitch is still falling through the chest range.'},
 {id:'sub',label:'Sub',min:0,max:100,unit:' %',dec:0,def:90,tip:'Level of the tail that sits on the Tail pitch. This is the low weight you feel.'},
 {id:'hold',label:'Hold',min:0,max:30,unit:' ms',dec:1,def:12,tip:'Keeps the kick at full level for a few ms before it decays, so the top of the hit lands harder.'},
 {id:'decay',label:'Decay',min:40,max:300,log:1,unit:' ms',dec:0,def:140,tip:'Time from the end of Hold until the kick is silent (-60 dB). The marker on the waveform shows one 16th note at your tempo.'},
 {id:'drive',label:'Drive',min:0,max:100,unit:' %',dec:0,def:15,tip:'Smooth symmetric saturation. Adds harmonics so the kick is heard on small speakers. Level is matched, so it does not just get louder.'},
 {id:'trans',label:'Transistor',min:0,max:100,unit:' %',dec:0,def:10,tip:'Asymmetric saturation with even harmonics and extra low weight.'},
 {id:'fuzz',label:'Fuzz',min:0,max:100,unit:' %',dec:0,def:0,tip:'Smooth fuzz stage. Keep low for clean kicks, push for hard dance.'},
 {id:'clip',label:'Clip',min:0,max:100,unit:' %',dec:0,def:20,tip:'Soft clipper at the end. More clip makes the kick denser and louder without going over 0 dB.'},
 {id:'out',label:'Output',min:-24,max:6,unit:' dB',dec:1,def:0,tip:'Output level in dB. Watch the meter on the right.'}
];
const LK=[];
for(let i=0;i<3;i++){const n='ABC'[i];
  SPEC.push(
   {id:`l${i}lvl`,label:'Level',min:0,max:100,unit:' %',dec:0,def:50,tip:`Loudness of layer ${n}.`},

function drawWood(c,left){
  const g=c._g,w=c._w,h=c._h;let s=left?7:19;const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
  g.fillStyle='#3d2210';g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=1){
    const a=rnd();g.fillStyle=`rgba(123,74,38,${0.4*a})`;g.fillRect(x,0,1+Math.floor(rnd()*2),h);
    const b=rnd();g.fillStyle=`rgba(90,52,25,${0.75*b})`;g.fillRect(x+0.5,0,1,h);
    if(rnd()<0.25){g.fillStyle='rgba(20,10,4,0.35)';g.fillRect(x,rnd()*h*0.2,1,h);}

    const dx=e.clientX-x0,dy=e.clientY-y0;let nw=W*s0,nh=H*s0,cw=0,ch=0;
    if(d.includes('e'))cw=nw+2*dx;if(d.includes('w'))cw=nw-2*dx;if(d.includes('s'))ch=nh+2*dy;if(d.includes('n'))ch=nh-2*dy;

/* ---------- drawing ---------- */
let buf=new Float32Array(1),mags=null,rmsInfo={peak:0};
function clearC(c){const g=c._g;g.fillStyle=CSS.display;g.fillRect(0,0,c._w,c._h);return g;}
function txt(g,s,x,y,col,al,font){g.fillStyle=col;g.textAlign=al||'left';g.font=font||'10px "JetBrains Mono",monospace';g.fillText(s,x,y);}
const pitchGeom=c=>({l:44,r:c._w-46,t:12,b:c._h-22});
const fy=(f,gm)=>gm.t+(1-Math.log(f/20)/Math.log(80))*(gm.b-gm.t);
const fx=(ms,gm)=>gm.l+ms/100*(gm.r-gm.l);
function drawPitch(){
  const c=$('#cvPitch'),g=clearC(c),gm=pitchGeom(c);
  g.lineWidth=1;g.strokeStyle=CSS.grid;
  [25,50,100,200,400,800,1600].forEach(f=>{const y=fy(f,gm);g.beginPath();g.moveTo(gm.l,y);g.lineTo(gm.r,y);g.stroke();txt(g,f+(f>=1000?'':''),gm.l-5,y+3,CSS.cap,'right');});
  txt(g,'Hz',8,gm.b+12,CSS.cap,'left');
  for(let ms=0;ms<=100;ms+=10){const x=fx(ms,gm);g.beginPath();g.moveTo(x,gm.t);g.lineTo(x,gm.b);g.stroke();txt(g,ms,x,gm.b+12,CSS.cap,'center');}
  txt(g,'ms',gm.r+4,gm.b+12,CSS.cap,'left');
  // zones: body 120-300 Hz, sub 40-60 Hz
  g.fillStyle=CSS['c-body'];g.globalAlpha=.08;g.fillRect(gm.l,fy(300,gm),gm.r-gm.l,fy(120,gm)-fy(300,gm));
  g.fillStyle=CSS['c-sub'];g.fillRect(gm.l,fy(60,gm),gm.r-gm.l,fy(40,gm)-fy(60,gm));g.globalAlpha=1;
  txt(g,'BODY 120-300',gm.r-4,fy(300,gm)+10,CSS['c-body'],'right');txt(g,'SUB 40-60',gm.r-4,fy(40,gm)-3,CSS['c-sub'],'right');
  // tail line
  const yt=fy(P.tailHz,gm);g.strokeStyle=CSS.curve2;g.setLineDash([5,4]);g.beginPath();g.moveTo(gm.l,yt);g.lineTo(gm.r,yt);g.stroke();g.setLineDash([]);
  const nn=hz2note(P.tailHz);txt(g,`${nn.name} ${P.tailHz.toFixed(1)} Hz`,gm.r+3,yt+3,CSS.curve2,'left');
  // curve
  g.strokeStyle=CSS.curve;g.lineWidth=2;g.beginPath();
  for(let i=0;i<=200;i++){const ms=i/2,f=P.tailHz+(P.startHz-P.tailHz)*Math.exp(-3*Math.pow(ms/P.sweep,P.curve));
    const x=fx(ms,gm),y=fy(clamp(f,20,1600),gm);i?g.lineTo(x,y):g.moveTo(x,y);}
  g.stroke();g.lineWidth=1;
  // nodes
  const f1=P.tailHz+(P.startHz-P.tailHz)*Math.exp(-3);
  [[fx(0,gm),fy(P.startHz,gm)],[fx(P.sweep,gm),fy(f1,gm)]].forEach(p=>{g.fillStyle=CSS.ground;g.strokeStyle=CSS.curve;g.lineWidth=2;g.beginPath();g.arc(p[0],p[1],6,0,7);g.fill();g.stroke();});
  g.lineWidth=1;
  txt(g,`${P.startHz.toFixed(0)} Hz`,fx(0,gm)+10,fy(P.startHz,gm)+3,CSS.read,'left');
  txt(g,`${P.sweep.toFixed(1)} ms`,fx(P.sweep,gm)+10,fy(f1,gm)-8,CSS.read,'left');
}
let drag=null;
(function(){
  const c=$('#cvPitch');
  const pos=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*c._w,y:(e.clientY-r.top)/r.height*c._h};};
  function hitTest(p){const gm=pitchGeom(c),f1=P.tailHz+(P.startHz-P.tailHz)*Math.exp(-3);
    if(Math.hypot(p.x-fx(0,gm),p.y-fy(P.startHz,gm))<11)return'start';
    if(Math.hypot(p.x-fx(P.sweep,gm),p.y-fy(f1,gm))<11)return'sweep';
    if(Math.abs(p.y-fy(P.tailHz,gm))<7&&p.x>=gm.l&&p.x<=gm.r)return'tail';return null;}
  c.addEventListener('pointermove',e=>{const p=pos(e);
    if(drag){const gm=pitchGeom(c);
      if(drag==='start')set('startHz',20*Math.pow(80,1-(p.y-gm.t)/(gm.b-gm.t)));
      else if(drag==='tail')set('tailHz',20*Math.pow(80,1-(p.y-gm.t)/(gm.b-gm.t)));
      else set('sweep',(p.x-gm.l)/(gm.r-gm.l)*100);return;}
    const h=hitTest(p);c.style.cursor=h==='sweep'?'ew-resize':h?'ns-resize':'default';});
  c.addEventListener('pointerdown',e=>{const h=hitTest(pos(e));if(h){drag=h;c.setPointerCapture(e.pointerId);}});
  c.addEventListener('pointerup',()=>{drag=null;});
  c.addEventListener('dblclick',e=>{const h=hitTest(pos(e));if(h)set(h==='start'?'startHz':h==='tail'?'tailHz':'sweep',S[h==='start'?'startHz':h==='tail'?'tailHz':'sweep'].def);});
})();

function drawWave(){
  const c=$('#cvWave'),g=clearC(c),l=40,r=c._w-10,t=24,b=c._h-20,mid=(t+b)/2;
  const lenMs=buf.length/sr*1000,xmax=Math.min(400,Math.max(160,Math.ceil((lenMs+10)/20)*20));
  const X=ms=>l+ms/xmax*(r-l);
  g.strokeStyle=CSS.grid;g.lineWidth=1;
  for(let ms=0;ms<=xmax;ms+=20){g.beginPath();g.moveTo(X(ms),t);g.lineTo(X(ms),b);g.stroke();txt(g,ms,X(ms),b+12,CSS.cap,'center');}
  txt(g,'ms',r,b+12,CSS.cap,'right');
  [[1,'0 dB'],[0.5,'-6'],[0,''],[-0.5,'-6'],[-1,'0 dB']].forEach(a=>{const y=mid-a[0]*(b-t)/2;g.beginPath();g.moveTo(l,y);g.lineTo(r,y);g.stroke();if(a[1])txt(g,a[1],l-4,y+3,CSS.cap,'right');});
  // anatomy strip
  const ce=P.clickLen*1.5,segs=[[0,ce,CSS['c-click'],'CLICK'],[ce,Math.max(45,ce),CSS['c-body'],'BODY'],[Math.max(45,ce),xmax,CSS['c-sub'],'SUB']];
  segs.forEach(s=>{if(s[1]<=s[0])return;g.fillStyle=s[2];g.globalAlpha=.9;g.fillRect(X(s[0]),t-12,X(s[1])-X(s[0]),4);g.globalAlpha=1;if(X(s[1])-X(s[0])>34)txt(g,s[3],X(s[0])+3,t-14,s[2],'left','9px "JetBrains Mono",monospace');});
  // waveform
  const spp=buf.length/sr*1000>0?(xmax/1000*sr)/(r-l):1;
  g.fillStyle=CSS.fill;g.globalAlpha=.9;
  for(let x=0;x<r-l;x++){let mn=0,mx=0;const a=Math.floor(x*spp),bb=Math.min(buf.length,Math.floor((x+1)*spp)+1);
    for(let i=a;i<bb;i++){const v=buf[i];if(v<mn)mn=v;if(v>mx)mx=v;}
    if(a>=buf.length)break;g.fillRect(l+x,mid-mx*(b-t)/2,1,Math.max(1,(mx-mn)*(b-t)/2));}
  g.globalAlpha=1;
  // 16th and tail end markers
  const sx=60000/bpm/4,tailEnd=P.hold+P.decay;
  g.setLineDash([4,3]);g.lineWidth=1.5;
  g.strokeStyle=CSS['m-warn'];g.beginPath();g.moveTo(X(sx),t);g.lineTo(X(sx),b);g.stroke();
  g.strokeStyle=CSS.curve2;g.beginPath();g.moveTo(X(tailEnd),t);g.lineTo(X(tailEnd),b);g.stroke();g.setLineDash([]);
  txt(g,`16th ${sx.toFixed(1)} ms`,X(sx)+3,b-4,CSS['m-warn'],'left');
  txt(g,`end ${tailEnd.toFixed(0)} ms`,X(tailEnd)+3,t+10,CSS.curve2,'left');
  $('#waveSub').textContent=`length ${lenMs.toFixed(0)} ms at ${(sr/1000).toFixed(1)} kHz`;
}
function drawSpec(){
  const c=$('#cvSpec'),g=clearC(c),l=34,r=c._w-8,t=10,b=c._h-18,f0=20,f1=12000;
  const FX=f=>l+Math.log(f/f0)/Math.log(f1/f0)*(r-l),DY=d=>t+(-d)/90*(b-t);
  g.strokeStyle=CSS.grid;g.lineWidth=1;
  [-80,-60,-40,-20,0].forEach(d=>{const y=DY(d);g.beginPath();g.moveTo(l,y);g.lineTo(r,y);g.stroke();txt(g,d,l-4,y+3,CSS.cap,'right');});
  [20,50,100,200,500,1000,2000,5000,10000].forEach(f=>{const x=FX(f);g.beginPath();g.moveTo(x,t);g.lineTo(x,b);g.stroke();txt(g,f>=1000?(f/1000)+'k':f,x,b+12,CSS.cap,'center');});
  txt(g,'dB',6,b+12,CSS.cap,'left');
  if(mags){const wpx=Math.floor(r-l),cv=specCurve(mags,sr,wpx,f0,f1);
    g.beginPath();g.moveTo(l,b);for(let x=0;x<wpx;x++)g.lineTo(l+x,clamp(DY(cv[x]),t,b));g.lineTo(l+wpx,b);g.closePath();
    g.globalAlpha=.35;g.fillStyle=CSS.fill;g.fill();g.globalAlpha=1;
    g.strokeStyle=CSS.curve;g.lineWidth=1.5;g.beginPath();for(let x=0;x<wpx;x++){const y=clamp(DY(cv[x]),t,b);x?g.lineTo(l+x,y):g.moveTo(l+x,y);}g.stroke();}
  const xt=FX(P.tailHz);g.strokeStyle=CSS.curve2;g.setLineDash([4,3]);g.beginPath();g.moveTo(xt,t);g.lineTo(xt,b);g.stroke();g.setLineDash([]);
  const nn=hz2note(P.tailHz);txt(g,`${nn.name} ${P.tailHz.toFixed(1)}`,xt+4,t+10,CSS.curve2,'left');
}
function drawLayers(){
  for(let i=0;i<3;i++){
    const c=$('#lw'+i);if(!c._g)continue;const g=clearC(c),w=c._w,h=c._h,src=P[`l${i}src`];
    g.strokeStyle=CSS.grid;g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();
    txt(g,'100 ms',w-4,h-3,CSS.cap,'right','9px "JetBrains Mono",monospace');
    if(SLOTMSG[i]){txt(g,SLOTMSG[i],6,h/2+3,CSS['m-clip'],'left','10px "JetBrains Mono",monospace');continue;}
    if(!src){txt(g,'Off',6,h/2+3,CSS.cap,'left','10px "JetBrains Mono",monospace');continue;}
    if(src===7&&!SAMP[i]){txt(g,'Drop a sound here, or click Load',6,h/2+3,CSS.cap,'left','10px "JetBrains Mono",monospace');continue;}
    const N=Math.floor(0.1*sr),L=genLayer(P,i,sr,N);if(!L)continue;
    let pkL=0;for(let q=0;q<N;q++)pkL=Math.max(pkL,Math.abs(L[q]));const sc=pkL>0?0.42*h/pkL:0;

  }

function drawGap(){
  const c=$('#cvGap'),g=clearC(c),l=10,r=c._w-10,beat=60000/bpm,Xp=ms=>l+ms/beat*(r-l);

  const te=Math.min(beat,P.hold+P.decay);
  g.fillStyle=CSS.fill;g.globalAlpha=.55;g.fillRect(l,y0,Xp(te)-l,hh);g.globalAlpha=1;
  g.fillStyle=CSS['m-warn'];g.globalAlpha=.25;g.fillRect(Xp(beat/4),y0,Xp(beat)-Xp(beat/4),hh);g.globalAlpha=1;
  g.strokeStyle=CSS.curve2;g.lineWidth=2;g.beginPath();g.moveTo(Xp(te),y0-4);g.lineTo(Xp(te),y0+hh+4);g.stroke();

/* meter */
let lvl=-99,hold=-99,holdT=0,clipLatch=false,minDb=-48,maxDb=3;
function db2y(d,c){return 4+(1-(clamp(d,minDb,maxDb)-minDb)/(maxDb-minDb))*(c._h-8);}
function drawMeter(){
  const c=$('#cvMeter'),g=clearC(c),x0=26,bw=c._w-x0-6;
  [0,-6,-12,-18,-24,-36,-48].forEach(d=>{const y=db2y(d,c);g.strokeStyle=CSS.line;g.beginPath();g.moveTo(x0-4,y);g.lineTo(x0,y);g.stroke();txt(g,d,x0-6,y+3,CSS.cap,'right','9px "JetBrains Mono",monospace');});
  const yv=db2y(lvl,c),yb=db2y(minDb,c);
  const zones=[[minDb,-12,CSS['m-ok']],[-12,0,CSS['m-warn']],[0,maxDb,CSS['m-clip']]];
  zones.forEach(z=>{const ya=db2y(z[1],c),yb2=db2y(z[0],c),top=Math.max(ya,yv);if(top<yb2){g.fillStyle=z[2];g.fillRect(x0,top,bw,yb2-top);}});
  g.fillStyle='#ffffff30';g.fillRect(x0,db2y(0,c)-0.5,bw,1);
  const yh=db2y(hold,c);g.fillStyle=CSS.text;g.fillRect(x0,yh-1,bw,2);

function dbCol(d){return d>=0?CSS['m-clip']:d>-12?CSS['m-warn']:CSS['m-ok'];}
$('#pkRead').addEventListener('click',()=>{clipLatch=false;hold=-99;});

/* ---------- readouts ---------- */
function updateChips(){
  const beat=60000/bpm,sx=beat/4,te=P.hold+P.decay,pct=te/sx*100;
  let pk=0;for(let i=0;i<buf.length;i++){const a=Math.abs(buf[i]);if(a>pk)pk=a;}
  let first=0;for(let i=0;i<Math.min(buf.length,2000);i++){if(Math.abs(buf[i])>0.01*pk){first=buf[i];break;}}
  const pdb=pk>0?20*Math.log10(pk):-99;
  $('#chips').innerHTML=`<span class="chip">Tail ends ${te.toFixed(0)} ms</span><span class="chip">${pct.toFixed(0)}% of a 16th (${sx.toFixed(1)} ms)</span><span class="chip">1st cycle ${first>=0?'▲ +':'▼ -'}</span>`;
  $('#rpk').textContent=pdb.toFixed(1)+' dB';$('#rpk').style.color=dbCol(pdb);
  $('#polBtn').classList.toggle('on',P.pol<0);
}
function refresh(){
  const t0=performance.now();
  noteCache={};buf=renderKick(P,sr);mags=spectrumDb(buf,sr);
  if(ctx){const ab=ctx.createBuffer(1,buf.length,sr);ab.copyToChannel(buf,0);curBuf=ab;}
  updateChips();drawPitch();drawWave();drawSpec();drawGap();drawLayers();
  window.__renderMs=performance.now()-t0;
}
function redrawAll(){if(buf.length>1){drawPitch();drawWave();drawSpec();drawGap();drawLayers();drawMeter();}}

/* ---------- main loop (paused when hidden) ---------- */
let visible=true;
new IntersectionObserver(es=>{visible=es[0].isIntersecting;}).observe($('#win'));
function frame(){
  requestAnimationFrame(frame);
  if(document.hidden||!visible)return;
  if(dirty){dirty=false;refresh();}
  let pk=0;
  if(analyser){analyser.getFloatTimeDomainData(tbuf);for(let i=0;i<tbuf.length;i++){const a=Math.abs(tbuf[i]);if(a>pk)pk=a;}}
  const d=pk>0.00003?20*Math.log10(pk):-99;
  lvl=d>lvl?d:Math.max(d,lvl-1.2);
  if(d>hold){hold=d;holdT=performance.now();}else if(performance.now()-holdT>1200)hold=Math.max(d,hold-0.6);
  if(d>=-0.05)clipLatch=true;
  const pr=$('#pkRead');pr.textContent=hold<-90?'-inf':(clipLatch?'CLIP':hold.toFixed(1));pr.style.color=clipLatch?CSS['m-clip']:dbCol(hold);
  drawMeter();
}

let bubbles=true,tipT=null;const tip=$('#tip');
document.addEventListener('pointerover',e=>{
  const el=e.target.closest&&e.target.closest('[data-tip]');clearTimeout(tipT);tip.classList.remove('show');
  if(!el||!bubbles||e.pointerType==='touch')return;
  tipT=setTimeout(()=>{tip.textContent=el.dataset.tip;const r=el.getBoundingClientRect();
    tip.style.left=clamp(r.left,8,innerWidth-270)+'px';tip.style.top=Math.min(innerHeight-80,r.bottom+6)+'px';tip.classList.add('show');},1000);
});
document.addEventListener('pointerdown',()=>{clearTimeout(tipT);tip.classList.remove('show');});

/* ---------- keyboard ---------- */
let baseMidi=24,keyTrack=true;const down=new Set();
const AKEY={KeyA:0,KeyW:1,KeyS:2,KeyE:3,KeyD:4,KeyF:5,KeyT:6,KeyG:7,KeyY:8,KeyH:9,KeyU:10,KeyJ:11,KeyK:12,KeyO:13,KeyL:14,KeyP:15,Semicolon:16,Quote:17};
const ALAB={KeyA:'A',KeyW:'W',KeyS:'S',KeyE:'E',KeyD:'D',KeyF:'F',KeyT:'T',KeyG:'G',KeyY:'Y',KeyH:'H',KeyU:'U',KeyJ:'J',KeyK:'K',KeyO:'O',KeyL:'L',KeyP:'P',Semicolon:';',Quote:"'"};
const OFF2CODE={};Object.keys(AKEY).forEach(c=>OFF2CODE[AKEY[c]]=c);
const codeNote={};
function buildPiano(){
  const pn=$('#piano');pn.innerHTML='';const W0=pn.clientWidth||900,ww=W0/21;
  const white=[0,2,4,5,7,9,11];let wi=0;const keys={};
  for(let o=0;o<3;o++)for(let k=0;k<12;k++){
    const m=baseMidi+o*12+k,isW=white.includes(k),el=document.createElement('div');el.dataset.m=m;
    el.setAttribute('aria-label',NOTE[k]+(Math.floor(m/12)-1));
    const off=o*12+k;let lab='';if(OFF2CODE[off]){lab=ALAB[OFF2CODE[off]];codeNote[OFF2CODE[off]]=m;}
    if(isW){el.className='wk'+(k===0?' c':'');el.style.left=wi*ww+'px';el.style.width=ww+'px';el.textContent=lab;
      if(k===0)el.title='';wi++;}
    else{el.className='bk';const bw=ww*0.62;el.style.left=(wi*ww-bw/2)+'px';el.style.width=bw+'px';el.textContent=lab;}
    pn.appendChild(el);keys[m]=el;
  }
  pn._keys=keys;
}
function setBase(m){baseMidi=clamp(m,24,60);Object.keys(codeNote).forEach(k=>delete codeNote[k]);buildPiano();}
function noteBuf(m){
  if(!keyTrack||!ctx)return curBuf;if(noteCache[m])return noteCache[m];
  const f=440*Math.pow(2,(m-69)/12),q=Object.assign({},P,{tailHz:f,startHz:P.startHz*f/P.tailHz});
  const x=renderKick(q,sr),ab=ctx.createBuffer(1,x.length,sr);ab.copyToChannel(x,0);return(noteCache[m]=ab);
}
function noteOn(m){
  wake();if(dirty){dirty=false;refresh();}
  hit(0,noteBuf(m));
  const f=440*Math.pow(2,(m-69)/12),n=hz2note(f);$('#played').textContent=keyTrack?`${n.name} ${f.toFixed(1)} Hz`:'kick';
  const el=$('#piano')._keys&&$('#piano')._keys[m];if(el){el.classList.add('on');setTimeout(()=>{if(!down.has(m))el.classList.remove('on');},180);}
}
let ptr=false;
$('#piano').addEventListener('pointerdown',e=>{const el=e.target.closest('[data-m]');if(!el)return;ptr=true;$('#piano').setPointerCapture(e.pointerId);noteOn(+el.dataset.m);});
$('#piano').addEventListener('pointermove',e=>{if(!ptr)return;const el=document.elementFromPoint(e.clientX,e.clientY);const k=el&&el.closest&&el.closest('[data-m]');
  if(k&&k.dataset.m!==$('#piano')._last){$('#piano')._last=k.dataset.m;noteOn(+k.dataset.m);}});
$('#piano').addEventListener('pointerup',()=>{ptr=false;$('#piano')._last=null;});
$('#oDn').onclick=()=>setBase(baseMidi-12);$('#oUp').onclick=()=>setBase(baseMidi+12);
function setKM(on){keyTrack=on;$('#kmP').classList.toggle('on',on);$('#kmS').classList.toggle('on',!on);}
$('#kmP').onclick=()=>setKM(true);$('#kmS').onclick=()=>setKM(false);

/* ---------- presets ---------- */
const mk=(name,tag,o)=>({name,tag,p:Object.assign({},o)});
const D=()=>{const o={};SPEC.forEach(s=>o[s.id]=s.def);LK.forEach(k=>o[k]=k.endsWith('pol')?1:0);return o;};
const FACTORY=[
 mk('Uplifting 138','uplifting',D()),
 mk('Dark Rolling','dark',Object.assign(D(),{tailHz:48.999,startHz:700,sweep:35,curve:1.1,clickLvl:35,clickFreq:2500,clickLen:3,body:70,sub:100,hold:14,decay:160,drive:25,trans:20,fuzz:0,clip:20})),
 mk('Punchy Click','punchy',Object.assign(D(),{tailHz:55,startHz:1000,sweep:24,curve:0.9,clickLvl:80,clickFreq:4500,clickLen:5,body:100,sub:70,hold:10,decay:120,drive:20,trans:10,fuzz:5,clip:30,l0src:3,l0lvl:35,l0len:20,l0hp:2000})),
 mk('Subby Deep','sub',Object.assign(D(),{tailHz:46.249,startHz:600,sweep:40,curve:1.3,clickLvl:25,clickFreq:2000,clickLen:3,body:55,sub:100,hold:15,decay:190,drive:8,trans:0,fuzz:0,clip:10})),
 mk('Hard Dance','hard',Object.assign(D(),{tailHz:61.735,startHz:1200,sweep:22,curve:0.8,clickLvl:90,clickFreq:5000,clickLen:6,body:100,sub:80,hold:10,decay:110,drive:45,trans:30,fuzz:20,clip:55,l0src:4,l0lvl:30,l0len:20,l0hp:1500,l1src:5,l1lvl:25,l1len:30,l1hp:6000,l1delay:2})),
 mk('Init','init',D())
];
let user=[];try{user=JSON.parse(localStorage.getItem('kk-user')||'[]');}catch(e){user=[];}
if(!Array.isArray(user))user=[];
let cur={list:'f',i:0},edited=false;
const all=()=>FACTORY.map((p,i)=>({p,list:'f',i})).concat(user.map((p,i)=>({p,list:'u',i})));
function saveUser(){try{localStorage.setItem('kk-user',JSON.stringify(user));}catch(e){}}
function getCur(){return cur.list==='f'?FACTORY[cur.i]:user[cur.i];}
function load(pr){SPEC.forEach(s=>{if(typeof pr.p[s.id]==='number')P[s.id]=clamp(pr.p[s.id],s.min,s.max);});P.pol=pr.p.pol===-1?-1:1;
  LK.forEach(k=>{const v=pr.p[k];P[k]=k.endsWith('pol')?(v===-1?-1:1):(Number.isInteger(v)&&v>=0&&v<=7?v:0);});
  SPEC.forEach(s=>knobs[s.id]&&knobs[s.id].ui());slotEls.forEach((e,i)=>slotRefresh(i));syncKey();dirty=true;edited=false;nameUi();}
function nameUi(){const c=getCur();$('#pName').textContent=(c?c.name:'')+(edited?' *':'');
  $('#pRename').disabled=$('#pDel').disabled=cur.list==='f';}
function presetEdited(){if(!edited){edited=true;nameUi();}}
function step(d){const a=all(),k=a.findIndex(x=>x.list===cur.list&&x.i===cur.i),n=a[(k+d+a.length)%a.length];cur={list:n.list,i:n.i};load(n.p);}
$('#pPrev').onclick=()=>step(-1);$('#pNext').onclick=()=>step(1);
function snapshot(name,tag){const p={};SPEC.forEach(s=>p[s.id]=+P[s.id].toFixed(4));p.pol=P.pol;LK.forEach(k=>p[k]=P[k]);return{name,tag:tag||'mine',p};}

/* dialogs */
const back=$('#dlgBack'),dlg=$('#dlg');
function openDlg(html,after){dlg.innerHTML=html;back.hidden=false;if(after)after(dlg);const f=dlg.querySelector('input,textarea,button');if(f)f.focus();}
function closeDlg(){back.hidden=true;dlg.innerHTML='';}
back.addEventListener('pointerdown',e=>{if(e.target===back)closeDlg();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!back.hidden)closeDlg();});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function listDlg(){
  openDlg(`<h3>Presets</h3><input type="text" id="q" placeholder="Search name or tag" aria-label="Search presets"><div class="list" id="pl"></div><div class="btns"><button id="x">Close</button></div>`,d=>{
    const q=d.querySelector('#q'),pl=d.querySelector('#pl');
    function fill(){const s=q.value.trim().toLowerCase();pl.innerHTML='';
      all().filter(a=>!s||(a.p.name+' '+a.p.tag+' '+(a.list==='f'?'factory':'user')).toLowerCase().includes(s)).forEach(a=>{
        const it=document.createElement('div');it.className='item'+(a.list===cur.list&&a.i===cur.i?' cur':'');
        it.innerHTML=`${esc(a.p.name)}<span>${a.list==='f'?'factory':'mine'} · ${esc(a.p.tag)}</span>`;
        it.onclick=()=>{cur={list:a.list,i:a.i};load(a.p);closeDlg();};pl.appendChild(it);});}
    q.oninput=fill;fill();d.querySelector('#x').onclick=closeDlg;});
}
$('#pName').onclick=listDlg;
function saveDlg(prefill,renameIdx){
  openDlg(`<h3>${renameIdx!=null?'Rename preset':'Save preset'}</h3><input type="text" id="nm" maxlength="40" value="${esc(prefill)}" aria-label="Preset name"><div class="err" id="er"></div><div class="btns"><button id="c">Cancel</button><button id="ok" class="on">${renameIdx!=null?'Rename':'Save'}</button></div>`,d=>{
    d.querySelector('#c').onclick=closeDlg;
    d.querySelector('#ok').onclick=()=>{
      const nm=d.querySelector('#nm').value.replace(/[^\w .#()+-]/g,'').trim().slice(0,40);
      if(!nm){d.querySelector('#er').textContent='Give it a name.';return;}
      if(renameIdx!=null){user[renameIdx].name=nm;saveUser();cur={list:'u',i:renameIdx};nameUi();closeDlg();return;}
      const ex=user.findIndex(u=>u.name.toLowerCase()===nm.toLowerCase());
      const fac=FACTORY.some(f=>f.name.toLowerCase()===nm.toLowerCase());
      if(ex>=0){openDlg(`<h3>Overwrite?</h3><p>"${esc(user[ex].name)}" already exists.</p><div class="btns"><button id="c2">Cancel</button><button id="nw">Save as new</button><button id="ow" class="on">Overwrite</button></div>`,e=>{
        e.querySelector('#c2').onclick=closeDlg;
        e.querySelector('#ow').onclick=()=>{user[ex]=snapshot(user[ex].name);saveUser();cur={list:'u',i:ex};edited=false;nameUi();closeDlg();};
        e.querySelector('#nw').onclick=()=>{user.push(snapshot(nm+' 2'));saveUser();cur={list:'u',i:user.length-1};edited=false;nameUi();closeDlg();};});return;}
      user.push(snapshot(fac?nm+' (mine)':nm));saveUser();cur={list:'u',i:user.length-1};edited=false;nameUi();closeDlg();};});
}
$('#pSave').onclick=()=>{const c=getCur();saveDlg(cur.list==='u'?c.name:c.name+' (mine)');};
$('#pRename').onclick=()=>{if(cur.list==='u')saveDlg(getCur().name,cur.i);};
$('#pDel').onclick=()=>{if(cur.list!=='u')return;const nm=getCur().name;
  openDlg(`<h3>Delete preset?</h3><p>"${esc(nm)}" will be removed.</p><div class="btns"><button id="c">Cancel</button><button id="ok" class="on">Delete</button></div>`,d=>{
    d.querySelector('#c').onclick=closeDlg;d.querySelector('#ok').onclick=()=>{user.splice(cur.i,1);saveUser();cur={list:'f',i:0};load(FACTORY[0]);closeDlg();};});};
$('#pExp').onclick=()=>{const c=snapshot(getCur().name,getCur().tag);const t=JSON.stringify({kickKitten:1,name:c.name,tag:c.tag,p:c.p});
  openDlg(`<h3>Export</h3><p>Copy this text and share it. Others use Import.</p><textarea id="ta" readonly>${esc(t)}</textarea><div class="btns"><button id="cp">Copy</button><button id="x" class="on">Close</button></div>`,d=>{
    const ta=d.querySelector('#ta');d.querySelector('#x').onclick=closeDlg;
    d.querySelector('#cp').onclick=()=>{ta.select();try{navigator.clipboard.writeText(t).catch(()=>{});}catch(e){}};});};
$('#pImp').onclick=()=>{openDlg(`<h3>Import</h3><p>Paste shared sound text. Unknown keys and wrong values are ignored.</p><textarea id="ta"></textarea><div class="err" id="er"></div><div class="btns"><button id="c">Cancel</button><button id="ok" class="on">Import</button></div>`,d=>{
  d.querySelector('#c').onclick=closeDlg;
  d.querySelector('#ok').onclick=()=>{
    let o;try{o=JSON.parse(d.querySelector('#ta').value);}catch(e){d.querySelector('#er').textContent='This is not valid text from Export.';return;}
    if(!o||o.kickKitten!==1||typeof o.p!=='object'||o.p===null){d.querySelector('#er').textContent='This is not a Kick Kitten sound.';return;}
    const p={};let n=0;SPEC.forEach(s=>{if(typeof o.p[s.id]==='number'&&isFinite(o.p[s.id])){p[s.id]=clamp(o.p[s.id],s.min,s.max);n++;}});
    if(!n){d.querySelector('#er').textContent='No usable values found.';return;}
    p.pol=o.p.pol===-1?-1:1;LK.forEach(k=>{const v=o.p[k];if(k.endsWith('pol'))p[k]=v===-1?-1:1;else p[k]=(Number.isInteger(v)&&v>=0&&v<=7)?v:0;});const full=Object.assign(D(),p);
    const nm=String(o.name||'Imported').replace(/[^\w .#()+-]/g,'').trim().slice(0,40)||'Imported';
    user.push({name:nm,tag:'imported',p:full});saveUser();cur={list:'u',i:user.length-1};load(user[cur.i]);closeDlg();};});};
$('#bGuide').onclick=()=>openDlg(`<h3>Guide</h3><ul>
<li>Drag a knob up or down. Shift for fine. Mouse wheel works. Double click resets.</li>
<li>In the pitch graph drag the left dot (Start), the second dot (Sweep) and the dashed line (Tail).</li>
<li>Pick the Key of your song. The tail pitch snaps to its note.</li>
<li>The orange line on the waveform is where the kick ends. The purple line is one 16th note at your tempo.</li>
<li>Space: hit the kick as set. Left and right arrows: previous and next preset.</li>
<li>Keys work like Ableton Live: A S D F G H J K L ; ' are white keys, W E T Y U O P are black keys, Z octave down, X octave up. Same plays the identical kick on every key. Pitched retunes the kick to the note you press, so it plays up or down.</li>
<li>Layers A, B and C add clicks, attacks and tops on top of the kick. Pick a built-in sound, or drop your own sound file on a layer, or press Load. Level, Pitch, Start, Len, Delay, HP and LP shape each one.</li>
<li>Click the note chip under Key (for example F1 +45 ct) to snap Tail to exactly that note.</li>
<li>Zoom with the buttons, drag any edge or corner, or double click a wood side to return to 100%.</li></ul><div class="btns"><button id="x" class="on">Close</button></div>`,d=>d.querySelector('#x').onclick=closeDlg);
$('#bSet').onclick=()=>openDlg(`<h3>Settings</h3>
<div class="row"><label><input type="checkbox" id="sb" ${bubbles?'checked':''} style="width:auto"> Info bubbles after hovering</label></div>
<div class="row"><label for="lk">Colour look</label><select id="lk"><option value="C">PurrOne</option><option value="A">Neon Navy</option><option value="B">Purple Soda Pop</option></select></div>
<p style="color:var(--dim)">Graphics pause when the window is hidden. Sound keeps running.</p>
<div class="btns"><button id="x" class="on">Close</button></div>`,d=>{
  d.querySelector('#lk').value=document.documentElement.dataset.look||'C';
  d.querySelector('#lk').onchange=e=>setLook(e.target.value);
  d.querySelector('#sb').onchange=e=>{bubbles=e.target.checked;try{localStorage.setItem('kk-bub',bubbles?'1':'0');}catch(er){}};
  d.querySelector('#x').onclick=closeDlg;});
$('#bAbout').onclick=()=>openDlg(`<h3>About &amp; Support</h3>
<p><b>Kick Kitten</b> by Studio 87, v0.1 design mockup.</p>
<p>Free and open source (AGPL-3.0-or-later). It collects nothing and uses no network.</p>
<p>Your sounds are saved in: Linux <code>~/.local/share/Studio 87/Kick Kitten/presets</code>; Windows <code>%APPDATA%\\Studio 87\\Kick Kitten\\presets</code>; macOS <code>~/Library/Application Support/Studio 87/Kick Kitten/presets</code>.</p>
<p><a href="https://github.com/SpeakingColors/KickKitten" target="_blank" rel="noopener">GitHub page</a> · <a href="https://ko-fi.com/studio87" target="_blank" rel="noopener">Support on Ko-fi</a></p>
<div class="btns"><button id="x" class="on">Close</button></div>`,d=>d.querySelector('#x').onclick=closeDlg);

/* ---------- transport / keys ---------- */
function wake(){if(ctx&&ctx.state!=='running')ctx.resume();}
$('#hitBtn').addEventListener('click',()=>{wake();if(dirty){dirty=false;refresh();}hit();});
$('#loopBtn').addEventListener('click',()=>{wake();setLoop(!loopOn);});
$('#bassBtn').addEventListener('click',()=>{bassOn=!bassOn;$('#bassBtn').classList.toggle('on',bassOn);});
$('#bpm').addEventListener('input',e=>{const v=parseFloat(e.target.value);if(v>=60&&v<=200){bpm=v;dirty=true;}});
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;if(!back.hidden)return;
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&codeNote[e.code]!==undefined){e.preventDefault();if(!e.repeat){down.add(codeNote[e.code]);noteOn(codeNote[e.code]);}return;}
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.code==='KeyZ'){e.preventDefault();if(!e.repeat)setBase(baseMidi-12);return;}
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.code==='KeyX'){e.preventDefault();if(!e.repeat)setBase(baseMidi+12);return;}
  if(e.code==='Space'&&!e.target.closest('button')){e.preventDefault();wake();hit();}
  else if(e.key==='ArrowLeft'&&!e.target.closest('.knob')){step(-1);}
  else if(e.key==='ArrowRight'&&!e.target.closest('.knob')){step(1);}
});
document.addEventListener('keyup',e=>{const m=codeNote[e.code];if(m!==undefined){down.delete(m);const el=$('#piano')._keys&&$('#piano')._keys[m];if(el)el.classList.remove('on');}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dirty=true;});

/* ---------- start ---------- */
try{bubbles=localStorage.getItem('kk-bub')!=='0';const l=localStorage.getItem('kk-look');if(l==='A'||l==='B')document.documentElement.dataset.look=l;}catch(e){}
readCss();fitDefault();
function boot(){buildPiano();setScale(defScale);nameUi();requestAnimationFrame(frame);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(boot,boot);else boot();
window.__kk={P,renderKick,SPEC,FACTORY,spectrumDb,load,set,get sr(){return sr;},get buf(){return buf;},refresh};
})();
</script>
